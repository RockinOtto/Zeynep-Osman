<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeynep · Osman</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="background-hearts"></div>

    <!-- Menü -->
    <nav class="navbar box-glass">
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Ana Sayfa</a></li>
            <li><a href="{{ url_for('gallery') }}" class="{{ 'active' if request.endpoint == 'gallery' }}">Anılar</a></li>
            <li><a href="#" class="nav-placeholder">· · ·</a></li>
        </ul>
        <button class="theme-toggle-nav" onclick="toggleTheme()" title="Mod Değiştir">
            🌙
        </button>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="site-footer">
        <p>Made by Osman KAYA</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        // Gece Modu Kontrolü
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle-nav');

            body.classList.toggle('dark-mode');

            // Tercihi kaydet
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                if (btn) btn.innerHTML = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                if (btn) btn.innerHTML = '🌙';
            }
        }

        // Sayfa yüklendiğinde tercihi uygula
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const btn = document.querySelector('.theme-toggle-nav');

            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                if (btn) btn.innerHTML = '☀️';
            }
        });
    </script>
</body>

</html>
